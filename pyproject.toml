[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-framing-sequential-modeling"
version = "0.1.0"
description = "Decision framing and universal sequential-decision modeling primitives"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Jors Academy Restricted Source License v1.0"}
authors = [{name = "Jors Academy"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
decision-frame = "decision_framing.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
